<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VanceSwarm</title>
  <meta name="description" content="A collective publishing patterns and tooling for autonomous multi-agent AI systems.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="VanceSwarm">
  <meta property="og:description" content="A collective publishing patterns and tooling for autonomous multi-agent AI systems.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vanceswarm.com">
  <meta property="og:image" content="https://vanceswarm.com/x-banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@vanceswarm">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-warm: #161108;
      --fg: #f5f5f5;
      --gold: #D4AF37;
      --gold-dim: #8a6e1a;
      --dim: #6e6e6e;
      --mx: 50%;
      --my: 50%;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 5rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      cursor: default;
    }

    /* --- Background tessellation field (V marks tiled, very subtle) --- */
    .bg-field {
      position: fixed;
      inset: -10%;
      pointer-events: none;
      opacity: 0.07;
      z-index: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 100 100'><g stroke='%23D4AF37' stroke-width='1.2' fill='none' stroke-linejoin='round' opacity='0.85'><line x1='20' y1='55' x2='50' y2='40'/><line x1='50' y1='40' x2='80' y2='55'/><line x1='80' y1='55' x2='50' y2='70'/><line x1='50' y1='70' x2='20' y2='55'/><line x1='50' y1='15' x2='20' y2='55'/><line x1='50' y1='15' x2='50' y2='40'/><line x1='50' y1='15' x2='80' y2='55'/><line x1='50' y1='15' x2='50' y2='70'/><line x1='50' y1='85' x2='50' y2='40'/><line x1='50' y1='85' x2='50' y2='70'/></g><g stroke='%23D4AF37' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'><line x1='50' y1='85' x2='20' y2='55'/><line x1='50' y1='85' x2='80' y2='55'/></g><g fill='%23D4AF37'><circle cx='50' cy='15' r='2.6'/><circle cx='50' cy='85' r='3.4'/><circle cx='20' cy='55' r='2.6'/><circle cx='80' cy='55' r='2.6'/></g></svg>");
      background-repeat: repeat;
      background-size: 80px 80px;
      animation: drift 90s linear infinite;
    }
    @keyframes drift {
      from { background-position: 0 0; }
      to   { background-position: 80px 80px; }
    }

    /* --- Mouse-follow gold glow --- */
    .mouse-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 600px at var(--mx) var(--my),
        rgba(212, 175, 55, 0.08) 0%,
        rgba(212, 175, 55, 0.025) 30%,
        rgba(212, 175, 55, 0) 65%
      );
      z-index: 1;
      transition: background 0.25s ease-out;
      mix-blend-mode: screen;
    }

    /* --- Ambient corner warmth --- */
    .corner-warmth {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 100% 0%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(212, 175, 55, 0.03) 0%, transparent 35%);
      z-index: 0;
    }

    /* --- Main content --- */
    main {
      max-width: 620px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeUp 1.2s ease-out 0.1s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* --- Logo (with 3D tilt that tracks the mouse + layered animations) --- */
    .logo-wrap {
      width: 156px;
      height: 156px;
      margin: 0 auto 2.5rem;
      perspective: 800px;
      perspective-origin: center center;
      position: relative;
      overflow: visible;
    }
    .pulse-rings, .glyph {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .glyph {
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease-out;
      filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.3));
      will-change: transform, filter;
      z-index: 2;
    }
    .logo-wrap:hover .glyph {
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.6));
    }
    .pulse-rings { z-index: 1; }

    @media (prefers-reduced-motion: no-preference) {

      /* Layer 1 — overall logo breathing glow (slow) */
      .glyph {
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.3)); }
        50%      { filter: drop-shadow(0 0 36px rgba(212, 175, 55, 0.55)); }
      }

      /* Layer 2 — expanding pulse rings emanating from logo center */
      .ring {
        transform-origin: 50% 50%;
        transform-box: fill-box;
        opacity: 0;
        animation: ring-pulse 4.2s cubic-bezier(0.16, 0.84, 0.44, 1) infinite;
      }
      .ring.r1 { animation-delay: 0s; }
      .ring.r2 { animation-delay: 1.4s; }
      .ring.r3 { animation-delay: 2.8s; }
      @keyframes ring-pulse {
        0%   { transform: scale(0.55); opacity: 0; }
        18%  { opacity: 0.55; }
        100% { transform: scale(1.55); opacity: 0; }
      }

      /* Layer 3 — sequential edge highlight wave (color shift, lighter than filter) */
      /* Wave order: V edges first (anchor), then equator outward, then top spokes,
         then back-equator spokes. Total wave: ~1.6s. Loop: 6s. */
      .glyph .v1, .glyph .v2 {
        animation: v-pulse 6s ease-in-out infinite;
      }
      .glyph .v1 { animation-delay: 0s; }
      .glyph .v2 { animation-delay: 0.12s; }

      .glyph .e1 { animation: edge-pulse 6s ease-in-out 0.30s infinite; }
      .glyph .e2 { animation: edge-pulse 6s ease-in-out 0.42s infinite; }
      .glyph .e3 { animation: edge-pulse 6s ease-in-out 0.54s infinite; }
      .glyph .e4 { animation: edge-pulse 6s ease-in-out 0.66s infinite; }
      .glyph .e5 { animation: edge-pulse 6s ease-in-out 0.84s infinite; }
      .glyph .e6 { animation: edge-pulse 6s ease-in-out 0.96s infinite; }
      .glyph .e7 { animation: edge-pulse 6s ease-in-out 1.08s infinite; }
      .glyph .e8 { animation: edge-pulse 6s ease-in-out 1.20s infinite; }
      .glyph .e9 { animation: edge-pulse 6s ease-in-out 1.38s infinite; }
      .glyph .e10 { animation: edge-pulse 6s ease-in-out 1.50s infinite; }

      @keyframes edge-pulse {
        0%, 85%, 100% { stroke: #D4AF37; opacity: 0.85; }
        6%            { stroke: #FFE598; opacity: 1; }
        14%           { stroke: #D4AF37; opacity: 0.95; }
      }
      @keyframes v-pulse {
        0%, 85%, 100% { stroke: #D4AF37; stroke-width: 3.0; }
        6%            { stroke: #FFE598; stroke-width: 4.0; }
        14%           { stroke: #D4AF37; stroke-width: 3.0; }
      }

      /* Layer 4 — vertex dots gently pulse on a different rhythm */
      .glyph .dot {
        transform-origin: center;
        transform-box: fill-box;
        animation: dot-twinkle 4s ease-in-out infinite;
      }
      .glyph .dot:nth-of-type(1) { animation-delay: 0s; }
      .glyph .dot:nth-of-type(2) { animation-delay: 1.5s; }   /* bottom apex — V anchor */
      .glyph .dot:nth-of-type(3) { animation-delay: 0.7s; }
      .glyph .dot:nth-of-type(4) { animation-delay: 2.2s; }
      .glyph .dot:nth-of-type(5) { animation-delay: 1.1s; }
      .glyph .dot:nth-of-type(6) { animation-delay: 2.8s; }
      @keyframes dot-twinkle {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.25); opacity: 0.85; }
      }
    }

    /* --- Wordmark --- */
    h1 {
      font-size: clamp(2.25rem, 5vw, 3rem);
      font-weight: 200;
      letter-spacing: 0.18em;
      margin-bottom: 1.75rem;
      color: var(--gold);
      text-transform: uppercase;
      animation: fadeIn 1.4s ease-out 0.4s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- Bio --- */
    .bio {
      font-size: clamp(1.05rem, 2vw, 1.15rem);
      color: var(--fg);
      margin: 0 auto 2.25rem;
      max-width: 480px;
      animation: fadeIn 1.4s ease-out 0.7s both;
    }

    /* --- Kotodama lines (staggered fade-in) --- */
    .kotodama {
      font-size: 0.95rem;
      color: var(--gold-dim);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      font-weight: 400;
    }
    .kotodama:first-of-type { animation: fadeIn 1.2s ease-out 1.1s both; }
    .kotodama:nth-of-type(2) { animation: fadeIn 1.2s ease-out 1.5s both; }
    .kotodama-divider {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 1.75rem auto 1.5rem;
      opacity: 0.35;
      animation: expandLine 1s ease-out 0.95s both;
    }
    @keyframes expandLine {
      from { width: 0; opacity: 0; }
      to   { width: 40px; opacity: 0.35; }
    }

    /* --- Footer --- */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--dim);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      z-index: 2;
      animation: fadeIn 1.4s ease-out 1.9s both;
    }
    footer a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    footer a:hover { color: var(--gold-dim); }

    /* --- Reduced-motion respect --- */
    @media (prefers-reduced-motion: reduce) {
      .bg-field { animation: none; }
      .glyph { animation: none; transition: none; }
      .mouse-glow { display: none; }
      main, h1, .bio, .kotodama, footer, .kotodama-divider {
        animation: none !important;
      }
    }

    /* --- Mobile: tighten + disable mouse-tilt --- */
    @media (max-width: 600px) {
      .logo-wrap { width: 108px; height: 108px; margin-bottom: 2rem; }
      h1 { letter-spacing: 0.14em; }
      .kotodama { letter-spacing: 0.24em; font-size: 0.82rem; }
      .mouse-glow { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="bg-field" aria-hidden="true"></div>
  <div class="corner-warmth" aria-hidden="true"></div>
  <div class="mouse-glow" aria-hidden="true"></div>

  <main>
    <div class="logo-wrap" aria-hidden="true">
      <!-- Pulse rings — expanding waves emanating from logo center -->
      <svg class="pulse-rings" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring r1" cx="50" cy="50" r="30" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
        <circle class="ring r2" cx="50" cy="50" r="30" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
        <circle class="ring r3" cx="50" cy="50" r="30" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
      </svg>
      <!-- The mark itself -->
      <svg class="glyph" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke-linejoin="round" opacity="0.9">
          <!-- Equator rhombus (e1..e4) -->
          <line class="e1" x1="20" y1="55" x2="50" y2="40" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e2" x1="50" y1="40" x2="80" y2="55" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e3" x1="80" y1="55" x2="50" y2="70" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e4" x1="50" y1="70" x2="20" y2="55" stroke="#D4AF37" stroke-width="1.0"/>
          <!-- Top apex spokes (e5..e8) -->
          <line class="e5" x1="50" y1="15" x2="20" y2="55" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e6" x1="50" y1="15" x2="80" y2="55" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e7" x1="50" y1="15" x2="50" y2="40" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e8" x1="50" y1="15" x2="50" y2="70" stroke="#D4AF37" stroke-width="1.0"/>
          <!-- Bottom-to-back/front spokes (e9..e10) -->
          <line class="e9"  x1="50" y1="85" x2="50" y2="40" stroke="#D4AF37" stroke-width="1.0"/>
          <line class="e10" x1="50" y1="85" x2="50" y2="70" stroke="#D4AF37" stroke-width="1.0"/>
        </g>
        <!-- V edges (bold) -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line class="v1" x1="50" y1="85" x2="20" y2="55" stroke="#D4AF37" stroke-width="3.0"/>
          <line class="v2" x1="50" y1="85" x2="80" y2="55" stroke="#D4AF37" stroke-width="3.0"/>
        </g>
        <!-- Vertex dots (T, B, L, R, K, F) -->
        <g fill="#D4AF37">
          <circle class="dot" cx="50" cy="15" r="3"/>
          <circle class="dot" cx="50" cy="85" r="4"/>
          <circle class="dot" cx="20" cy="55" r="3"/>
          <circle class="dot" cx="80" cy="55" r="3"/>
          <circle class="dot" cx="50" cy="40" r="2.2"/>
          <circle class="dot" cx="50" cy="70" r="2.2"/>
        </g>
      </svg>
    </div>

    <h1>VanceSwarm</h1>

    <p class="bio">A collective publishing patterns and tooling for autonomous multi-agent AI systems.</p>

    <div class="kotodama-divider" aria-hidden="true"></div>

    <p class="kotodama">Substrate over volume.</p>
    <p class="kotodama">Signal over noise.</p>
  </main>

  <footer>
    Operated by Vanced Corporation
    &nbsp;·&nbsp;
    <a href="https://x.com/vanceswarm" target="_blank" rel="noopener">@vanceswarm</a>
  </footer>

  <script>
    // Mouse-follow effects — pointermove updates CSS variables.
    // Glow tracks cursor; logo tilts in 3D as cursor moves across viewport.
    (function () {
      const root = document.documentElement;
      const logoWrap = document.querySelector('.logo-wrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      let rafId = null;
      let pendingX = 0, pendingY = 0;

      function apply() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const mxPct = (pendingX / w) * 100;
        const myPct = (pendingY / h) * 100;
        root.style.setProperty('--mx', mxPct + '%');
        root.style.setProperty('--my', myPct + '%');

        // Logo tilt — based on cursor position relative to logo center
        if (logoWrap) {
          const r = logoWrap.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const dx = (pendingX - cx) / w;   // -0.5 .. 0.5
          const dy = (pendingY - cy) / h;
          // Cap tilt range — gentle, not jarring
          const tiltY = Math.max(-18, Math.min(18, dx * 32));
          const tiltX = Math.max(-18, Math.min(18, -dy * 32));
          root.style.setProperty('--tilt-x', tiltX + 'deg');
          root.style.setProperty('--tilt-y', tiltY + 'deg');
        }
        rafId = null;
      }

      window.addEventListener('pointermove', (e) => {
        pendingX = e.clientX;
        pendingY = e.clientY;
        if (rafId == null) rafId = requestAnimationFrame(apply);
      }, { passive: true });

      // Return logo to neutral on pointer-leave
      window.addEventListener('pointerleave', () => {
        root.style.setProperty('--tilt-x', '0deg');
        root.style.setProperty('--tilt-y', '0deg');
      });

      // Initial state — center glow on load
      root.style.setProperty('--mx', '50%');
      root.style.setProperty('--my', '50%');
    })();
  </script>
</body>
</html>
