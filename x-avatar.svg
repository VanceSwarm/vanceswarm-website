<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="VanceSwarm X.com avatar">
  <!-- Charcoal background — will be cropped to circle by X.com -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  <!-- Octahedral V logo centered, scaled to ~260px in a 400px field -->
  <g transform="translate(70, 70) scale(2.6)">
    <g stroke="#D4AF37" stroke-width="1.0" fill="none" stroke-linejoin="round" opacity="0.85">
      <line x1="20" y1="55" x2="50" y2="40"/>
      <line x1="50" y1="40" x2="80" y2="55"/>
      <line x1="80" y1="55" x2="50" y2="70"/>
      <line x1="50" y1="70" x2="20" y2="55"/>
      <line x1="50" y1="15" x2="20" y2="55"/>
      <line x1="50" y1="15" x2="50" y2="40"/>
      <line x1="50" y1="15" x2="80" y2="55"/>
      <line x1="50" y1="15" x2="50" y2="70"/>
      <line x1="50" y1="85" x2="50" y2="40"/>
      <line x1="50" y1="85" x2="50" y2="70"/>
    </g>
    <g stroke="#D4AF37" stroke-width="3.0" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="85" x2="20" y2="55"/>
      <line x1="50" y1="85" x2="80" y2="55"/>
    </g>
    <g fill="#D4AF37">
      <circle cx="50" cy="15" r="3"/>
      <circle cx="50" cy="85" r="4"/>
      <circle cx="20" cy="55" r="3"/>
      <circle cx="80" cy="55" r="3"/>
      <circle cx="50" cy="40" r="2.2"/>
      <circle cx="50" cy="70" r="2.2"/>
    </g>
  </g>
</svg>
